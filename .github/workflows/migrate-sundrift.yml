name: Import Sundrift standalone source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sundrift-one-time-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack independent Sundrift project
        shell: bash
        run: |
          set -euo pipefail
          test -s sundrift-source.base64.txt
          base64 --decode sundrift-source.base64.txt > /tmp/sundrift-source.zip
          mkdir -p /tmp/sundrift-source
          unzip -q /tmp/sundrift-source.zip -d /tmp/sundrift-source
          test -f /tmp/sundrift-source/CMakeLists.txt
          test -f /tmp/sundrift-source/Source/PluginProcessor.cpp
          test -f /tmp/sundrift-source/Source/ToneEngine.h
          cp -a /tmp/sundrift-source/. .
          rm -f sundrift-source.base64.txt
          rm -f .github/workflows/migrate-sundrift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Import standalone Sundrift v0.1.2 JUCE source and DSP tests"
          git push origin HEAD:main
