name: Build Sundrift Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone DSP tests
        run: cmake -S tests -B build-dsp -DCMAKE_BUILD_TYPE=Release
      - name: Build standalone DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure

  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure with optional NAM A2 engine
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSUNDRIFT_WITH_NAM=ON -DSUNDRIFT_BUILD_TESTS=ON
      - name: Build VST3 and host/DSP tests
        shell: pwsh
        run: cmake --build build --config Release --target Sundrift_VST3 sundrift_tests sundrift_host_smoke --parallel 4
      - name: Run DSP and real JUCE editor lifecycle tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 in pluginval (including GUI tests)
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Sundrift.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Sundrift.vst3 bundle not found" }
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $exe = Get-ChildItem -Path pluginval -Recurse -File -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $exe) { throw "pluginval.exe was not found" }
          & $exe.FullName --validate "$($bundle.FullName)" --strictness-level 5 --timeout-ms 600000
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }
      - name: Package VST3
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Sundrift.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Sundrift.vst3 bundle not found" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination "release/Sundrift.vst3" -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Sundrift-Windows-x64-VST3
          path: release/Sundrift.vst3
          if-no-files-found: error
          retention-days: 14
